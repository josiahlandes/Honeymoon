<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C1116">
<title>The Schedule · Katie's Honeymoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Archivo:ital,wdth,wght@0,62..125,200..800;1,62..125,200..800&display=swap" rel="stylesheet">
<style>
/* The whole week, one compact manifest — and the control room:
   flexible events reorder with the arrows, Reserved stays pinned,
   changes save on this device and re-flow the main reel.
   Content renders from schedule-data.js.
   Design language mirrors the reel: each day card is a miniature
   of its chapter title card — ghost numeral, per-day stage light,
   accent-dash eyebrow, italic Bodoni title, Reserved stamps. */
:root{
  --night:#0C1116;
  --deep:#131A21;
  --ivory:#F2EDE3;
  --dim:rgba(242,237,227,.64);
  --faint:rgba(242,237,227,.5);
  --hairline:rgba(242,237,227,.14);
  --gold:#DFAE5A;
  --serif:'Bodoni Moda','Didot',serif;
  --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--night);color:var(--ivory);
  font-family:var(--sans);font-size:15px;line-height:1.5;
}
/* a single warm stage light over the top of the page */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 42% at 50% -6%, color-mix(in oklab, var(--gold) 8%, transparent), transparent 62%);
}
a{color:inherit}
::selection{background:var(--gold);color:var(--night)}

/* film grain, same stock as the reel */
.grain{
  position:fixed;inset:-40px;z-index:40;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='240'%20height='240'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='240'%20height='240'%20filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:240px 240px;
}

/* ---------- header (same hardware as the reel) ---------- */
.top{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 22px;
  background:color-mix(in oklab, var(--night) 62%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hairline);
}
.wordmark{
  font-family:var(--serif);font-style:italic;font-weight:600;
  font-size:17px;letter-spacing:.02em;text-decoration:none;white-space:nowrap;
}
.wordmark .amp{color:var(--gold)}
.back{
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  font-stretch:110%;text-decoration:none;color:var(--ivory);white-space:nowrap;
  border:1px solid var(--hairline);border-radius:999px;padding:9px 16px;
  transition:border-color .3s,color .3s;
}
.back:hover{border-color:var(--gold);color:var(--gold)}
.back:focus-visible,.wordmark:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- page head: an editorial moment, not a toolbar ---------- */
.head{
  max-width:1180px;margin:0 auto;
  padding:clamp(34px,6vh,64px) 22px 6px;
}
.eyebrow{
  display:flex;align-items:center;gap:14px;
  font-size:10.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
  font-stretch:118%;color:color-mix(in oklab, var(--gold) 82%, white 6%);
}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
.head h1{
  font-family:var(--serif);font-style:italic;font-weight:550;
  font-size:clamp(34px,5vw,54px);line-height:1.03;
  margin:12px 0 14px;text-wrap:balance;
}
.head-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px 26px;flex-wrap:wrap;
}
.legend{
  display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;
  font-size:11px;font-weight:500;color:var(--faint);
}
.legend .lg{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.chip{
  font-size:9px;font-weight:650;letter-spacing:.26em;text-transform:uppercase;
  font-stretch:115%;border-radius:2px;padding:4px 8px 4px 10px;
}
.chip.rsv{
  color:var(--gold);border:1px solid color-mix(in oklab, var(--gold) 72%, transparent);
  transform:rotate(-2deg);
}
.chip.flex{
  color:var(--dim);border:1px dashed rgba(242,237,227,.32);
}
.hint{
  color:var(--faint);font-weight:300;font-size:12.5px;max-width:52ch;
}
.hint b{color:var(--dim);font-weight:500}

/* ---------- the week: six miniature title cards ---------- */
.week{
  max-width:1180px;margin:0 auto;
  padding:clamp(20px,3.5vh,34px) 22px clamp(50px,8vh,80px);
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
}
.day{
  position:relative;overflow:hidden;
  background:var(--deep);
  border:1px solid color-mix(in oklab, var(--dc) 22%, rgba(242,237,227,.07));
  border-radius:3px;
  padding:20px 18px 10px;
  display:flex;flex-direction:column;
}
/* the chapter's stage light, in miniature */
.day::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 85% at 80% -10%, color-mix(in oklab, var(--dc) 16%, transparent), transparent 56%);
}
/* the chapter's ghost numeral, in miniature */
.ghost{
  position:absolute;top:-14px;right:8px;z-index:0;
  font-family:var(--serif);font-weight:500;line-height:1;
  font-size:96px;color:transparent;
  -webkit-text-stroke:1px color-mix(in oklab, var(--dc) 60%, transparent);
  opacity:.55;user-select:none;pointer-events:none;
}
.card-head{position:relative;z-index:1;padding-right:76px;min-height:64px}
.card-eyebrow{
  display:flex;align-items:center;gap:10px;
  font-size:9.5px;font-weight:650;letter-spacing:.26em;text-transform:uppercase;
  font-stretch:115%;color:color-mix(in oklab, var(--dc) 85%, white 5%);
}
.card-eyebrow::before{content:"";width:22px;height:1px;background:var(--dc)}
.card-head h2{
  font-family:var(--serif);font-style:italic;font-weight:550;
  font-size:20px;line-height:1.18;margin-top:7px;text-wrap:balance;
}

.evs{list-style:none;margin-top:12px;position:relative;z-index:1}
.evs li{
  display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;
  padding:8px 6px;margin:0 -6px;border-radius:3px;
  border-top:1px solid var(--hairline);
  font-size:13.5px;
}
@media (hover:hover){
  .evs li:has(.mv):hover{background:color-mix(in oklab, var(--dc) 6%, transparent)}
}
.evs .t{
  font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
  font-stretch:110%;color:var(--dc);align-self:baseline;padding-top:3px;
}
.evs .e{color:var(--dim);font-weight:300}
.evs .e b{color:var(--ivory);font-weight:500}
.evs .n{display:block;font-size:12px;color:var(--faint)}

/* locked rows carry the stamp where flexible rows carry the arrows */
.rsv{
  justify-self:end;align-self:center;
  font-size:8.5px;font-weight:650;letter-spacing:.24em;text-transform:uppercase;
  font-stretch:115%;color:var(--dc);
  border:1px solid color-mix(in oklab, var(--dc) 65%, transparent);
  border-radius:2px;padding:4px 7px 4px 9px;
  transform:rotate(-2deg);
  background:color-mix(in oklab, var(--night) 45%, transparent);
  white-space:nowrap;
}

/* reorder controls: the site's pill hardware, minaturized */
.mv{display:flex;gap:6px}
.mv button{
  width:32px;height:32px;border-radius:999px;cursor:pointer;
  background:none;border:1px solid var(--hairline);color:var(--dim);
  font-size:13px;line-height:1;font-family:var(--sans);
  transition:border-color .2s,color .2s,transform .1s;
  touch-action:manipulation;
}
.mv button:hover:not(:disabled){border-color:var(--dc);color:var(--dc)}
.mv button:active:not(:disabled){transform:translateY(1px)}
.mv button:focus-visible{outline:2px solid var(--dc);outline-offset:2px}
.mv button:disabled{opacity:.22;cursor:default}

/* the husband-voice reset, in his voice */
.day-foot{margin-top:auto;padding:10px 0 6px;text-align:right;position:relative;z-index:1}
.day-foot button{
  background:none;border:none;cursor:pointer;
  font-family:var(--serif);font-style:italic;font-weight:500;
  color:var(--faint);font-size:13px;
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:color-mix(in oklab, var(--dc) 45%, transparent);
  padding:8px 2px;touch-action:manipulation;
  transition:color .2s;
}
.day-foot button:hover{color:var(--dc)}
.day-foot button:focus-visible{outline:2px solid var(--dc);outline-offset:2px}

.foot{
  text-align:center;padding:10px 22px clamp(50px,8vh,90px);
  color:var(--faint);font-size:12.5px;font-weight:300;
}
.foot .xo{
  font-family:var(--serif);font-style:italic;font-weight:550;
  color:var(--gold);font-size:19px;display:block;margin-bottom:10px;
}

/* saved toast (stamp vocabulary) + screen-reader live region */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);
  background:color-mix(in oklab, var(--night) 55%, transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid color-mix(in oklab, var(--gold) 72%, transparent);color:var(--gold);
  font-weight:650;font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  font-stretch:115%;
  border-radius:2px;padding:10px 18px 10px 20px;z-index:50;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-live{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}

@media (prefers-reduced-motion:no-preference){
  @view-transition{navigation:auto}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
@media (max-width:520px){
  .evs li{grid-template-columns:1fr auto;grid-template-areas:"t side" "e side"}
  .evs .t{grid-area:t}
  .evs .e{grid-area:e}
  .evs .mv,.evs .rsv{grid-area:side;align-self:center}
  .head h1{font-size:clamp(30px,9vw,40px)}
}
@media print{
  body{background:#fff;color:#111}
  body::before{display:none}
  :root{--ivory:#111;--dim:#333;--faint:#666;--hairline:#ddd;--deep:#fff}
  .grain,.top,.back,.mv,.day-foot,.hint,.toast,.ghost{display:none}
  .day{break-inside:avoid;border-color:#ddd}
  .day::before{display:none}
  /* day accents and gold are too light for paper — go ink */
  .evs .t,.card-eyebrow,.eyebrow{color:#555}
  .card-eyebrow::before,.eyebrow::before{background:#999}
  .evs .e b{color:#000}
  .rsv,.chip.rsv{color:#444;border-color:#999;background:none;transform:none}
  .chip.flex{color:#555;border-color:#999}
  .foot .xo{color:#444}
}
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="wordmark" href="./">Katie <span class="amp">&amp;</span> Josiah</a>
  <a class="back" href="./">Back to the good stuff</a>
</header>

<div class="head">
  <p class="eyebrow">The Official Honeymoon Itinerary</p>
  <h1>The week, at a glance</h1>
  <div class="head-row">
    <p class="hint">Rearrange any day with the arrows — <b>Reserved stays put</b>. Changes save on this device and re-flow the main page.</p>
    <p class="legend">
      <span class="lg"><span class="chip rsv">Reserved</span> booked, set in stone</span>
      <span class="lg"><span class="chip flex">Flexible</span> bends to your will</span>
    </p>
  </div>
</div>

<main class="week" id="week">
  <noscript><p style="padding:20px;color:#999">The schedule needs JavaScript to render.</p></noscript>
</main>

<footer class="foot">
  <span class="xo">xoxo, your husband</span>
  <span id="foot-line"></span>
</footer>

<div class="toast" aria-hidden="true">Saved</div>
<div class="sr-live" aria-live="polite"></div>

<script>
window.__boot = () => {
  const H = window.HONEYMOON;
  if (!H) return;
  const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
  let reduce = reduceMQ.matches;
  reduceMQ.addEventListener?.("change", e => { reduce = e.matches; });

  /* working copy with any saved order applied; mutated by swaps */
  let DAYS = H.orderedDays();
  const pad = i => String(i + 1).padStart(2, "0");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  document.getElementById("foot-line").textContent =
    `${H.meta.homebase} · ${H.meta.sunsetNote}`;

  /* ---------- render ---------- */
  const week = document.getElementById("week");

  function dayHasMoves(day) {
    return day.events.some((ev, i) =>
      !ev.locked && (H.findSwap(day.events, i, -1) !== null || H.findSwap(day.events, i, 1) !== null));
  }

  function render() {
    week.innerHTML = DAYS.map((day, di) => `
      <section class="day" style="--dc:${esc(day.accent)}" aria-label="${esc(day.weekday)} ${esc(day.date)}">
        <span class="ghost" aria-hidden="true">${pad(di)}</span>
        <header class="card-head">
          <p class="card-eyebrow">${esc(day.dow)} · ${esc(day.date)}</p>
          <h2>${esc(day.title)}</h2>
        </header>
        <ul class="evs">
          ${day.events.map((ev, ei) => {
            const up = !ev.locked && H.findSwap(day.events, ei, -1) !== null;
            const dn = !ev.locked && H.findSwap(day.events, ei, 1) !== null;
            return `
          <li class="${ev.locked ? "lock" : ""}" data-id="${esc(ev.id)}">
            <span class="t">${esc(ev.timeShort)}</span>
            <span class="e"><b>${esc(ev.title)}</b>${ev.note ? `<span class="n">${esc(ev.note)}</span>` : ""}</span>
            ${ev.locked ? `<span class="rsv">Reserved</span>` : (up || dn) ? `
            <span class="mv">
              <button class="up" ${up ? "" : "disabled"} aria-label="Move ${esc(ev.title)} earlier"
                      onclick="moveEv(event,${di},${ei},-1)">↑</button>
              <button class="dn" ${dn ? "" : "disabled"} aria-label="Move ${esc(ev.title)} later"
                      onclick="moveEv(event,${di},${ei},1)">↓</button>
            </span>` : ""}
          </li>`;
          }).join("")}
        </ul>
        ${dayHasMoves(day) ? `
        <div class="day-foot">
          <button onclick="resetDay(${di})">Put ${esc(day.weekday)} back the way he had it</button>
        </div>` : ""}
      </section>`).join("");
  }

  /* ---------- toast + announcements ---------- */
  const toastEl = document.querySelector(".toast");
  const liveEl = document.querySelector(".sr-live");
  let toastTimer = null;
  function announce(msg, saved) {
    liveEl.textContent = "";
    setTimeout(() => { liveEl.textContent = msg; }, 20);
    toastEl.textContent = saved ? "Saved" : "Not saved";
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), saved ? 1400 : 2600);
  }

  /* ---------- move / reset (FLIP-animated, auto-saved) ---------- */
  let settleAt = 0; /* pointer clicks are ignored until rows settle */

  function withFlip(di, mutate) {
    const before = {};
    if (!reduce) {
      week.querySelectorAll(`.day:nth-child(${di + 1}) li`).forEach(li => {
        before[li.dataset.id] = li.getBoundingClientRect().top;
      });
    }
    mutate();
    const saved = H.saveOrder(DAYS);
    render();
    settleAt = performance.now() + 480;
    if (reduce) return saved;
    week.querySelectorAll(`.day:nth-child(${di + 1}) li`).forEach(li => {
      const old = before[li.dataset.id];
      if (old == null) return;
      const delta = old - li.getBoundingClientRect().top;
      if (Math.abs(delta) < 2) return;
      li.style.transition = "none";
      li.style.transform = `translateY(${delta}px)`;
      requestAnimationFrame(() => {
        li.style.transition = "transform .45s cubic-bezier(.22,1,.36,1)";
        li.style.transform = "";
        li.addEventListener("transitionend", () => { li.style.transition = ""; }, {once: true});
      });
    });
    return saved;
  }

  const savedSuffix = ok => ok ? "Saved."
    : "Heads up — this browser is blocking saves, so the order resets next visit.";

  window.moveEv = (evt, di, ei, dir) => {
    /* A fast second click lands where the rows *were* — on the wrong
       arrow. Ignore pointer clicks until the swap settles; keyboard
       activations (detail 0) follow focus and stay exact. */
    if (evt && evt.detail > 0 && performance.now() < settleAt) return;
    const events = DAYS[di].events;
    const j = H.findSwap(events, ei, dir);
    if (j === null) return;
    const moved = events[ei];
    const ok = withFlip(di, () => { [events[ei], events[j]] = [events[j], events[ei]]; });
    /* keep keyboard focus on the moved event's arrow */
    const li = week.querySelector(`.day:nth-child(${di + 1}) li[data-id="${moved.id}"]`);
    if (li) {
      const same = li.querySelector(dir < 0 ? ".up" : ".dn");
      const target = (same && !same.disabled) ? same : li.querySelector(".mv button:not([disabled])");
      if (target) target.focus();
    }
    announce(`Moved “${moved.title}” ${dir < 0 ? "earlier" : "later"}. ${savedSuffix(ok)}`, ok);
  };

  window.resetDay = di => {
    const ok = withFlip(di, () => {
      DAYS[di].events = H.clone(H.days[di].events);
    });
    /* the card re-rendered — put keyboard focus back on the reset control */
    week.querySelector(`.day:nth-child(${di + 1}) .day-foot button`)?.focus();
    announce(`${DAYS[di].weekday} is back the way he had it. ${savedSuffix(ok)}`, ok);
  };

  render();
};
</script>
<script src="gate.js" defer></script>
</body>
</html>
